[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab-mytorch"
version = "0.1.0"
description = "A small educational deep-learning framework built from scratch."
readme = "mytorch/README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI Lab" },
]
dependencies = []

[project.scripts]
mytorch-demo = "mytorch.main:main"

[tool.setuptools]
packages = ["mytorch"]
